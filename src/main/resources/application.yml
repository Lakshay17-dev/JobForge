spring:
  application:
    name: jobforge

  datasource:
    url: jdbc:postgresql://localhost:5432/jobforge
    username: jobforge
    password: jobforge
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
jobforge:
  worker:
    enabled: true
    threads: 4
    poll-interval-ms: 500
