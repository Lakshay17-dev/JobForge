services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobforge
      POSTGRES_USER: jobforge
      POSTGRES_PASSWORD: jobforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobforge -d jobforge"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
